[custom]
; ================================================================
; OpenClash / Mihomo 自定义模板
; 规则逻辑对齐 Clash Mi iOS 配置，增加非中国游戏独立策略组及八个地区节点
; 说明：这是 SubConverter 外部配置 INI，不是 Mihomo YAML。
; 需要 OpenClash 使用支持 GEOSITE / GEOIP 的 Mihomo(Meta) 内核。
; ================================================================

; ---------------- 规则集 ----------------
; 1. 局域网、私有域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,LAN

; 国内游戏优先直连，避免被后面的游戏总分类送入代理
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

; 2. STUN / WebRTC 相关拦截（与 Clash Mi 配置保持一致）
ruleset=🛑 广告拦截,[]DOMAIN-KEYWORD,stun
ruleset=🛑 广告拦截,[]DST-PORT,3478
ruleset=🛑 广告拦截,[]DST-PORT,19302

; 3. 广告过滤
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

; 4. AI 服务
ruleset=🤖 人工智能,[]GEOSITE,openai
ruleset=🤖 人工智能,[]GEOSITE,anthropic
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,claude.ai
ruleset=🤖 人工智能,[]DOMAIN-SUFFIX,groq.com
ruleset=🤖 人工智能,[]DOMAIN-KEYWORD,openai

; 5. 国际流媒体
ruleset=📺 国际流媒体,[]GEOSITE,youtube
ruleset=📺 国际流媒体,[]GEOSITE,netflix
ruleset=📺 国际流媒体,[]GEOSITE,spotify
ruleset=📺 国际流媒体,[]GEOSITE,disney

; 6. Telegram：域名 + IP 段
ruleset=📲 电报信息,[]GEOSITE,telegram
ruleset=📲 电报信息,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt

; 7. Google / Apple
ruleset=📢 谷歌服务,[]GEOSITE,google
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🍎 苹果服务,[]GEOSITE,icloud

; 8. 非中国游戏独立分流（国内游戏已在前面优先直连）
ruleset=🎮 非中国游戏,[]GEOSITE,category-games

; 9. 用户自己的额外代理域名，保留原 ownp.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/longhuiNG/oclashimport/refs/heads/main/ownp.list

; 10. 非中国大陆域名走代理；中国大陆域名和 IP 直连
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,[]GEOIP,CN

; 11. 最终兜底
ruleset=🐟 漏网之鱼,[]FINAL

; ---------------- 策略组 ----------------
; 主选择组：包含全部八个地区
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🎯 故障转移`[]🔯 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇹🇷 土耳其节点`[]🐸 手动切换`[]DIRECT

; 业务策略组
custom_proxy_group=🤖 人工智能`select`[]🇸🇬 狮城节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🚀 节点选择`[]🐸 手动切换
custom_proxy_group=📺 国际流媒体`select`[]🚀 节点选择`[]🔯 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇹🇷 土耳其节点`[]🐸 手动切换
custom_proxy_group=🎮 非中国游戏`select`[]♻️ 自动选择`[]🎯 故障转移`[]🔯 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇹🇷 土耳其节点`[]🚀 节点选择`[]🐸 手动切换
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🇸🇬 狮城节点`[]🔯 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🐸 手动切换
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]DIRECT`[]🐸 手动切换
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]🔯 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇹🇼 台湾节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🐸 手动切换
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]🐸 手动切换

; 自动测速：定期选择延迟较低的可用节点
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(官网|重置|剩余|到期|通知)).*$`http://www.gstatic.com/generate_204`300,,50

; 故障转移：主节点不可用时切换到下一个可用节点
custom_proxy_group=🎯 故障转移`fallback`^(?!.*(官网|重置|剩余|到期|通知)).*$`http://www.gstatic.com/generate_204`300,,50

; 地区自动测速组：香港、日本、新加坡、台湾、美国、英国、德国、土耳其
custom_proxy_group=🔯 香港节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(香港|港|hong[ -]?kong|(^|[^A-Za-z])HK([^A-Za-z]|$)|🇭🇰).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(日本|东京|大阪|japan|(^|[^A-Za-z])JP([^A-Za-z]|$)|🇯🇵).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(新加坡|狮城|singapore|(^|[^A-Za-z])SG([^A-Za-z]|$)|🇸🇬).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(台湾|台北|高雄|taiwan|(^|[^A-Za-z])TW([^A-Za-z]|$)|🇹🇼).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(美国|美西|美东|united[ -]?states|america|(^|[^A-Za-z])US(A)?([^A-Za-z]|$)|🇺🇸).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇬🇧 英国节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(英国|伦敦|曼彻斯特|英格兰|united[ -]?kingdom|great[ -]?britain|britain|england|(^|[^A-Za-z])UK([^A-Za-z]|$)|(^|[^A-Za-z])GB([^A-Za-z]|$)|🇬🇧).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇩🇪 德国节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(德国|法兰克福|柏林|慕尼黑|germany|deutschland|(^|[^A-Za-z])DE([^A-Za-z]|$)|🇩🇪).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇷 土耳其节点`url-test`(?i)^(?!.*(官网|重置|剩余|到期|通知)).*(土耳其|伊斯坦布尔|安卡拉|turkey|türkiye|turkiye|(^|[^A-Za-z])TR([^A-Za-z]|$)|🇹🇷).*$`http://www.gstatic.com/generate_204`300,,50

; 手动节点选择（过滤机场公告、流量及到期信息节点）
custom_proxy_group=🐸 手动切换`select`^(?!.*(官网|重置|剩余|到期|通知)).*$

; 启用自定义规则生成，并覆盖基础模板原有规则
enable_rule_generator=true
overwrite_original_rules=true
